<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="google-site-verification" content="9OQVhck4qd3nXu2yheAXjZWiuJH1c4er0bLx8ErttzE">

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">

  <title>Frontend Mentor | Interactive card details form</title>

  <link rel="stylesheet" href="./main.css">
  <script src="./app.js" defer></script>
</head>

<body>

  <div class="bg-theme"></div>

  <main>

    <div class="card-section">
      <div class="card-front cards">
        <img src="./assets/images/card-logo.svg" alt="card-logo">
        <div>
          <span class="card-number">0000 0000 0000 0000</span>
          <div class="name-and-expiry">
            <span class="user-name">Jane Appleseed</span>
            <div><span class="exp-month">00</span>/<span class="exp-year">00</span></div>
          </div>
        </div>

      </div>

      <div class="card-back cards">
        <span class="cvc">000</span>
      </div>
    </div>

    <div class="form-and-thanks-section">
      <form>
        <div class="input-group">
          <label for="name">CARDHOLDER NAME</label>
          <input type="text" id="name" maxlength="20" placeholder="e.g. Jane Appleseed" autocomplete="off">
          <span class="error-message"></span>
        </div>

        <div class="input-group">
          <label for="number">CARD NUMBER</label>
          <input type="text" id="number" maxlength="19" placeholder="e.g. 1234 5678 9123 0000" autocomplete="off">
          <span class="error-message"></span>
        </div>

        <div class="date-and-cvc">
          <div class="input-group">
            <span class="exp-date-label">EXP. DATE<label for="month">(MM</label>/<label for="year">YY)</label></span>
            <div class="month-year-input">
              <input type="text" id="month" maxlength="2" placeholder="MM" autocomplete="off">
              <input type="text" id="year" maxlength="2" placeholder="YY" autocomplete="off">
            </div>
            <span class="error-message"></span>
          </div>

          <div class="input-group">
            <label for="cvc">CVC</label>
            <input type="text" id="cvc" maxlength="3" placeholder="e.g. 123" autocomplete="off">
            <span class="error-message"></span>
          </div>
        </div>

        <button class="submit-btn btn">Confirm</button>
      </form>

      <!-- Completed state start -->
      <div class="thanks-dialogue">
        <svg width="80" height="80" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="40" cy="40" r="40" fill="url(#a)" />
          <path d="M28 39.92 36.08 48l16-16" stroke="#fff" stroke-width="3" />
          <defs>
            <linearGradient id="a" x1="-23.014" y1="11.507" x2="0" y2="91.507" gradientUnits="userSpaceOnUse">
              <stop offset="0" stop-color="#6348FE" />
              <stop offset="1" stop-color="#610595" />
            </linearGradient>
          </defs>
        </svg>
        <h1>THANK YOU!</h1>
        <p>We've added your card details</p>
        <button class="continue-btn btn">Continue</button>
      </div>
    </div>

  </main>

  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>.
    Coded by <a href="https://github.com/riyad-96" target="_blank">Riyad</a>.
  </footer>

</body>

</html>
